name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'bubu-12/codex-app-mirror'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream default branch
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Repository secret UPSTREAM_SYNC_TOKEN is not configured."
            exit 1
          fi
          gh api --method POST "repos/$GH_REPO/merge-upstream" -f branch=main
